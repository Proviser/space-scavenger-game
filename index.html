<!DOCTYPE html>
<html>
<head>
    <title>Space Scavenger</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a2a, #1a1a4a, #2a2a6a);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .container {
            text-align: center;
            padding: 15px;
            max-width: 500px;
            width: 100%;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .game-title {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.5);
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        .game-subtitle {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        #gameCanvas {
            display: block;
            border: 4px solid;
            border-image: linear-gradient(45deg, #ff6b6b, #4ecdc4) 1;
            border-radius: 12px;
            box-shadow: 
                0 0 40px rgba(78, 205, 196, 0.3),
                inset 0 0 40px rgba(0, 0, 0, 0.5);
            background: 
                radial-gradient(circle at 20% 50%, rgba(42, 42, 106, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 107, 107, 0.4) 0%, transparent 50%),
                #0a0a2a;
            margin: 15px auto;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-item {
            text-align: center;
            padding: 8px;
        }
        
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            padding: 0 10px;
        }
        
        .control-btn {
            padding: 14px 5px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            min-height: 50px;
        }
        
        .control-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
        
        .control-btn.held {
            transform: scale(0.92);
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
        
        .start-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        }
        
        .start-btn:active {
            box-shadow: 0 2px 8px rgba(78, 205, 196, 0.4);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(10, 10, 42, 0.95), rgba(26, 26, 74, 0.95));
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #4ecdc4;
            box-shadow: 0 0 50px rgba(78, 205, 196, 0.3);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1000;
            width: 90%;
            max-width: 350px;
        }
        
        .game-over h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .restart-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #ffd93d, #ff9a3d);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 217, 61, 0.3);
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .restart-btn:active {
            transform: scale(0.95);
        }
        
        .powerup-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .boss-health {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            display: none;
        }
        
        .boss-health-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
        }
        
        @media (max-width: 400px) {
            .container {
                padding: 10px;
            }
            
            .controls {
                gap: 8px;
                padding: 0 5px;
            }
            
            .control-btn {
                padding: 12px 5px;
                font-size: 1rem;
                min-height: 45px;
            }
            
            .stats-container {
                padding: 10px;
                gap: 8px;
            }
            
            .stat-value {
                font-size: 1.2rem;
            }
        }
        
        @media (max-height: 700px) {
            .container {
                transform: scale(0.9);
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="game-title">🚀 SPACE SCAVENGER</h1>
            <p class="game-subtitle">Destroy debris, collect powerups, defeat bosses!</p>
        </div>
        
        <div class="boss-health" id="bossHealth">
            <div class="boss-health-bar" id="bossHealthBar"></div>
        </div>
        
        <div class="powerup-indicator" id="powerupIndicator">
            <span id="powerupText">Powerup Active</span>
        </div>
        
        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Bricks</div>
                <div class="stat-value" id="bricks">40</div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="controls">
            <button class="control-btn" id="leftBtn">⬅️ LEFT</button>
            <button class="control-btn start-btn" id="startBtn">🚀 START</button>
            <button class="control-btn" id="rightBtn">➡️ RIGHT</button>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>🎮 MISSION FAILED</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Level Reached: <span id="finalLevel">1</span></p>
        <p>High Score: <span id="highScore">0</span></p>
        <button class="restart-btn" id="restartBtn">🔄 NEW MISSION</button>
    </div>

    <script>
        // ========== КОНФИГУРАЦИЯ ==========
        const CONFIG = {
            platform: {
                baseSpeed: 12,
                boostedSpeed: 18,
                width: 80,
                height: 15
            },
            ball: {
                baseSpeed: 5,
                maxSpeed: 8,
                radius: 8
            },
            powerups: {
                spawnChance: 0.2,
                types: ['speed', 'large', 'multiball', 'laser'],
                duration: {
                    speed: 10000,
                    large: 8000,
                    laser: 5000
                }
            },
            boss: {
                health: 150,
                spawnEvery: 3
            }
        };

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        let score = 0;
        let level = 1;
        let gameOver = false;
        let ballMoving = false;
        let animationId;
        let highScore = localStorage.getItem('spaceScavengerHighScore') || 0;
        let activePowerups = new Map();
        let bossActive = false;
        let bossHealth = CONFIG.boss.health;
        let particles = [];

        // Создаем звездный фон
        createStars();

        // Игровые объекты
        const platform = {
            x: canvas.width / 2 - CONFIG.platform.width / 2,
            y: canvas.height - 30,
            get speed() {
                return activePowerups.has('speed') ? CONFIG.platform.boostedSpeed : CONFIG.platform.baseSpeed;
            },
            get width() {
                return activePowerups.has('large') ? CONFIG.platform.width * 1.5 : CONFIG.platform.width;
            },
            height: CONFIG.platform.height
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: CONFIG.ball.radius,
            dx: CONFIG.ball.baseSpeed,
            dy: -CONFIG.ball.baseSpeed,
            get speed() {
                const base = activePowerups.has('speed') ? CONFIG.ball.maxSpeed : CONFIG.ball.baseSpeed;
                return base + (level - 1) * 0.3;
            }
        };

        let bricks = [];
        let powerups = [];
        let balls = [ball];

        // ========== СИСТЕМА УПРАВЛЕНИЯ ==========
        class InputManager {
            constructor() {
                this.keys = {};
                this.setupEventListeners();
            }
            
            setupEventListeners() {
                // Клавиатура
                document.addEventListener('keydown', (e) => {
                    if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                        e.preventDefault();
                    }
                    this.keys[e.key] = true;
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });
                
                // Кнопки управления
                const leftBtn = document.getElementById('leftBtn');
                const rightBtn = document.getElementById('rightBtn');
                const startBtn = document.getElementById('startBtn');
                
                // Левая кнопка
                leftBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['ArrowLeft'] = true;
                    leftBtn.classList.add('held');
                });
                
                leftBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys['ArrowLeft'] = false;
                    leftBtn.classList.remove('held');
                });
                
                leftBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    this.keys['ArrowLeft'] = true;
                    leftBtn.classList.add('held');
                });
                
                leftBtn.addEventListener('mouseup', (e) => {
                    this.keys['ArrowLeft'] = false;
                    leftBtn.classList.remove('held');
                });
                
                leftBtn.addEventListener('mouseleave', (e) => {
                    this.keys['ArrowLeft'] = false;
                    leftBtn.classList.remove('held');
                });
                
                // Правая кнопка
                rightBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.keys['ArrowRight'] = true;
                    rightBtn.classList.add('held');
                });
                
                rightBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.keys['ArrowRight'] = false;
                    rightBtn.classList.remove('held');
                });
                
                rightBtn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    this.keys['ArrowRight'] = true;
                    rightBtn.classList.add('held');
                });
                
                rightBtn.addEventListener('mouseup', (e) => {
                    this.keys['ArrowRight'] = false;
                    rightBtn.classList.remove('held');
                });
                
                rightBtn.addEventListener('mouseleave', (e) => {
                    this.keys['ArrowRight'] = false;
                    rightBtn.classList.remove('held');
                });
                
                // Кнопка старта
                startBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    startBall();
                });
                
                // Свайпы для мобильных устройств
                let touchStartX = 0;
                canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    e.preventDefault();
                });
                
                canvas.addEventListener('touchmove', (e) => {
                    const touchX = e.touches[0].clientX;
                    const diff = touchX - touchStartX;
                    
                    if (Math.abs(diff) > 5) {
                        this.keys['ArrowLeft'] = diff < 0;
                        this.keys['ArrowRight'] = diff > 0;
                        touchStartX = touchX;
                    }
                    e.preventDefault();
                });
                
                canvas.addEventListener('touchend', (e) => {
                    this.keys['ArrowLeft'] = false;
                    this.keys['ArrowRight'] = false;
                    e.preventDefault();
                });
            }
            
            isKeyPressed(key) {
                return this.keys[key] === true;
            }
        }

        const input = new InputManager();

        // ========== СИСТЕМА БУСТЕРОВ ==========
        const powerupEffects = {
            speed: {
                color: '#4ecdc4',
                text: 'SPEED BOOST!',
                apply() {
                    showPowerupIndicator('SPEED BOOST!', '#4ecdc4');
                },
                remove() {
                    hidePowerupIndicator();
                }
            },
            large: {
                color: '#ff9a3d',
                text: 'LARGE PADDLE!',
                apply() {
                    showPowerupIndicator('LARGE PADDLE!', '#ff9a3d');
                },
                remove() {
                    hidePowerupIndicator();
                }
            },
            multiball: {
                color: '#ff6b6b',
                text: 'MULTIBALL!',
                apply() {
                    spawnExtraBalls(2);
                    showPowerupIndicator('MULTIBALL!', '#ff6b6b');
                    setTimeout(hidePowerupIndicator, 2000);
                }
            },
            laser: {
                color: '#45b7d1',
                text: 'LASER POWER!',
                apply() {
                    showPowerupIndicator('LASER POWER!', '#45b7d1');
                },
                remove() {
                    hidePowerupIndicator();
                }
            }
        };

        // ========== ОСНОВНОЙ ИГРОВОЙ ЦИКЛ ==========
        class GameLoop {
            constructor() {
                this.lastTime = 0;
                this.deltaTime = 0;
            }
            
            start() {
                this.lastTime = performance.now();
                this.run();
            }
            
            run(currentTime = 0) {
                this.deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;
                
                // Ограничиваем FPS для стабильности
                if (this.deltaTime < 1/120) {
                    this.update(this.deltaTime);
                    this.render();
                }
                
                if (!gameOver) {
                    animationId = requestAnimationFrame((time) => this.run(time));
                }
            }
            
            update(deltaTime) {
                this.updatePlatform();
                this.updatePowerups(deltaTime);
                this.updateParticles(deltaTime);
                
                if (ballMoving) {
                    this.updateBalls(deltaTime);
                    this.checkCollisions();
                    this.checkPowerupExpiration();
                }
            }
            
            updatePlatform() {
                const speed = platform.speed;
                
                if (input.isKeyPressed('ArrowLeft')) {
                    platform.x = Math.max(0, platform.x - speed);
                }
                
                if (input.isKeyPressed('ArrowRight')) {
                    platform.x = Math.min(canvas.width - platform.width, platform.x + speed);
                }
            }
            
            updateBalls(deltaTime) {
                balls.forEach(ball => {
                    ball.x += ball.dx * ball.speed * deltaTime * 60;
                    ball.y += ball.dy * ball.speed * deltaTime * 60;
                    
                    // Отскок от стен
                    if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                        ball.dx = -ball.dx;
                        ball.x = Math.max(ball.radius, Math.min(canvas.width - ball.radius, ball.x));
                    }
                    
                    if (ball.y - ball.radius < 0) {
                        ball.dy = -ball.dy;
                        ball.y = ball.radius;
                    }
                });
                
                // Удаляем шары которые улетели вниз (кроме основного)
                balls = balls.filter((b, index) => index === 0 || b.y - b.radius < canvas.height);
                
                // Если все шары потеряны - игра окончена
                if (balls.length === 0) {
                    gameOver = true;
                }
            }
            
            updatePowerups(deltaTime) {
                powerups.forEach(powerup => {
                    powerup.y += powerup.speed * deltaTime * 60;
                });
                
                powerups = powerups.filter(powerup => powerup.y < canvas.height);
            }
            
            updateParticles(deltaTime) {
                particles.forEach(particle => {
                    particle.x += particle.vx * deltaTime * 60;
                    particle.y += particle.vy * deltaTime * 60;
                    particle.life -= deltaTime;
                });
                
                particles = particles.filter(p => p.life > 0);
            }
            
            checkCollisions() {
                this.checkBallBrickCollisions();
                this.checkBallPlatformCollisions();
                this.checkPowerupCollisions();
                this.checkLevelCompletion();
            }
            
            checkBallBrickCollisions() {
                balls.forEach(ball => {
                    for (let i = bricks.length - 1; i >= 0; i--) {
                        const brick = bricks[i];
                        
                        if (brick.health > 0 && this.checkBallBrickCollision(ball, brick)) {
                            brick.health--;
                            this.createBrickParticles(brick);
                            
                            if (brick.health <= 0) {
                                const points = brick.isBoss ? 500 : [10, 20, 50, 100][brick.type] || 10;
                                score += points;
                                document.getElementById('score').textContent = score;
                                
                                if (brick.isBoss) {
                                    bossActive = false;
                                    hideBossHealth();
                                    this.createBossExplosion(brick);
                                } else {
                                    this.spawnPowerup(brick);
                                }
                                
                                bricks.splice(i, 1);
                            }
                            
                            ball.dy = -ball.dy;
                            break;
                        }
                    }
                });
            }
            
            checkBallBrickCollision(ball, brick) {
                return ball.x + ball.radius > brick.x &&
                       ball.x - ball.radius < brick.x + brick.width &&
                       ball.y + ball.radius > brick.y &&
                       ball.y - ball.radius < brick.y + brick.height;
            }
            
            checkBallPlatformCollisions() {
                balls.forEach(ball => {
                    if (ball.y + ball.radius > platform.y &&
                        ball.y - ball.radius < platform.y + platform.height &&
                        ball.x > platform.x &&
                        ball.x < platform.x + platform.width) {
                        
                        // Угол отскока зависит от места удара
                        const hitPos = (ball.x - platform.x) / platform.width;
                        const angle = (hitPos - 0.5) * Math.PI / 3;
                        const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
                        
                        ball.dx = Math.sin(angle) * speed;
                        ball.dy = -Math.cos(angle) * speed;
                        ball.y = platform.y - ball.radius;
                        
                        this.createPlatformParticles(ball.x);
                    }
                });
            }
            
            checkPowerupCollisions() {
                for (let i = powerups.length - 1; i >= 0; i--) {
                    const powerup = powerups[i];
                    
                    if (powerup.x < platform.x + platform.width &&
                        powerup.x + powerup.width > platform.x &&
                        powerup.y < platform.y + platform.height &&
                        powerup.y + powerup.height > platform.y) {
                        
                        this.activatePowerup(powerup.type);
                        powerups.splice(i, 1);
                    }
                }
            }
            
            checkLevelCompletion() {
                const activeBricks = bricks.filter(brick => brick.health > 0).length;
                if (activeBricks === 0 && !bossActive) {
                    this.levelComplete();
                }
                updateBricksCount();
            }
            
            checkPowerupExpiration() {
                const now = Date.now();
                for (const [type, expiration] of activePowerups) {
                    if (now > expiration) {
                        activePowerups.delete(type);
                        const effect = powerupEffects[type];
                        if (effect && effect.remove) {
                            effect.remove();
                        }
                    }
                }
            }
            
            spawnPowerup(brick) {
                if (Math.random() < CONFIG.powerups.spawnChance) {
                    const type = CONFIG.powerups.types[Math.floor(Math.random() * CONFIG.powerups.types.length)];
                    powerups.push({
                        x: brick.x + brick.width / 2 - 10,
                        y: brick.y + brick.height / 2 - 10,
                        width: 20,
                        height: 20,
                        type: type,
                        color: powerupEffects[type].color,
                        speed: 2
                    });
                }
            }
            
            activatePowerup(type) {
                const effect = powerupEffects[type];
                if (!effect) return;
                
                effect.apply();
                
                if (CONFIG.powerups.duration[type]) {
                    const expiration = Date.now() + CONFIG.powerups.duration[type];
                    activePowerups.set(type, expiration);
                }
            }
            
            levelComplete() {
                level++;
                score += 500;
                document.getElementById('level').textContent = level;
                document.getElementById('score').textContent = score;
                
                resetBall();
                ballMoving = false;
                checkBossLevel();
                
                // Отправляем данные в Telegram
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.sendData(JSON.stringify({
                        action: 'level_complete',
                        score: score,
                        level: level
                    }));
                }
            }
            
            createBrickParticles(brick) {
                const color = brick.isBoss ? '#ff6b6b' : ['#A9A9A9', '#4169E1', '#32CD32', '#DC143C'][brick.type];
                for (let i = 0; i < 8; i++) {
                    particles.push({
                        x: brick.x + brick.width / 2,
                        y: brick.y + brick.height / 2,
                        vx: (Math.random() - 0.5) * 4,
                        vy: (Math.random() - 0.5) * 4,
                        radius: Math.random() * 3 + 1,
                        color: color,
                        life: 1
                    });
                }
            }
            
            createPlatformParticles(x) {
                for (let i = 0; i < 5; i++) {
                    particles.push({
                        x: x,
                        y: platform.y,
                        vx: (Math.random() - 0.5) * 3,
                        vy: -Math.random() * 3,
                        radius: Math.random() * 2 + 1,
                        color: '#4ecdc4',
                        life: 0.8
                    });
                }
            }
            
            createBossExplosion(brick) {
                for (let i = 0; i < 20; i++) {
                    particles.push({
                        x: brick.x + brick.width / 2,
                        y: brick.y + brick.height / 2,
                        vx: (Math.random() - 0.5) * 8,
                        vy: (Math.random() - 0.5) * 8,
                        radius: Math.random() * 4 + 2,
                        color: '#ff6b6b',
                        life: 2
                    });
                }
            }
            
            render() {
                // Очистка с небольшим затемнением для следов
                ctx.fillStyle = 'rgba(10, 10, 42, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                this.drawBricks();
                this.drawPowerups();
                this.drawBalls();
                this.drawPlatform();
                this.drawParticles();
                
                if (bossActive) {
                    this.drawBossHealth();
                }
            }
            
            drawBricks() {
                bricks.forEach(brick => {
                    if (brick.health > 0) {
                        const colors = ['#A9A9A9', '#4169E1', '#32CD32', '#DC143C', '#FF6B6B'];
                        ctx.fillStyle = colors[brick.type];
                        ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                        
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                        
                        // Полоска здоровья для босса и прочных блоков
                        if (brick.isBoss || brick.maxHealth > 1) {
                            const healthPercent = brick.health / brick.maxHealth;
                            ctx.fillStyle = `hsl(${healthPercent * 120}, 100%, 50%)`;
                            ctx.fillRect(brick.x, brick.y - 5, brick.width * healthPercent, 3);
                        }
                    }
                });
            }
            
            drawPowerups() {
                powerups.forEach(powerup => {
                    ctx.fillStyle = powerup.color;
                    ctx.fillRect(powerup.x, powerup.y, powerup.width, powerup.height);
                    
                    // Анимация пульсации
                    const pulse = Math.sin(Date.now() * 0.01) * 2;
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(powerup.x - pulse, powerup.y - pulse, powerup.width + pulse * 2, powerup.height + pulse * 2);
                });
            }
            
            drawBalls() {
                balls.forEach(ball => {
                    ctx.fillStyle = '#FF4444';
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Свечение
                    ctx.shadowColor = '#FF4444';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
            }
            
            drawPlatform() {
                ctx.fillStyle = '#8A2BE2';
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
                
                // Градиент для платформы
                const gradient = ctx.createLinearGradient(platform.x, platform.y, platform.x, platform.y + platform.height);
                gradient.addColorStop(0, '#9B30FF');
                gradient.addColorStop(1, '#7A1BBA');
                ctx.fillStyle = gradient;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            }
            
            drawParticles() {
                particles.forEach(particle => {
                    ctx.globalAlpha = particle.life;
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
            }
            
            drawBossHealth() {
                const boss = bricks.find(brick => brick.isBoss);
                if (boss) {
                    const healthPercent = boss.health / boss.maxHealth;
                    document.getElementById('bossHealthBar').style.width = (healthPercent * 100) + '%';
                }
            }
        }

        const gameLoop = new GameLoop();

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 2 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        function spawnExtraBalls(count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                balls.push({
                    x: ball.x,
                    y: ball.y,
                    radius: ball.radius,
                    dx: Math.cos(angle) * ball.speed,
                    dy: Math.sin(angle) * ball.speed
                });
            }
        }

        function showPowerupIndicator(text, color) {
            const indicator = document.getElementById('powerupIndicator');
            const powerupText = document.getElementById('powerupText');
            powerupText.textContent = text;
            indicator.style.display = 'block';
            indicator.style.borderColor = color;
        }

        function hidePowerupIndicator() {
            document.getElementById('powerupIndicator').style.display = 'none';
        }

        function showBossHealth() {
            document.getElementById('bossHealth').style.display = 'block';
        }

        function hideBossHealth() {
            document.getElementById('bossHealth').style.display = 'none';
        }

        function showGameOver() {
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('spaceScavengerHighScore', highScore);
            }
            
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('highScore').textContent = highScore;
            document.getElementById('gameOver').style.display = 'block';
            
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    action: 'game_over',
                    score: score,
                    level: level,
                    highScore: highScore
                }));
            }
        }

        function updateBricksCount() {
            const activeBricks = bricks.filter(brick => brick.health > 0).length;
            document.getElementById('bricks').textContent = activeBricks;
        }

        function updateHighScoreDisplay() {
            document.getElementById('highScore').textContent = highScore;
        }

        function generateBricks() {
            bricks = [];
            
            if (bossActive) {
                // Уровень с боссом
                bricks.push({
                    x: canvas.width / 2 - 100,
                    y: 150,
                    width: 200,
                    height: 40,
                    type: 4,
                    health: bossHealth,
                    maxHealth: CONFIG.boss.health,
                    isBoss: true
                });
            } else {
                // Обычный уровень
                const rows = 4 + Math.min(level - 1, 3);
                const cols = 10;
                                const brickWidth = 36;
                const brickHeight = 18;
                const padding = 4;
                
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        const brickType = row % 4;
                        const health = level >= 3 && Math.random() < 0.3 ? 2 : 1;
                        
                        bricks.push({
                            x: col * (brickWidth + padding) + padding,
                            y: row * (brickHeight + padding) + 50,
                            width: brickWidth,
                            height: brickHeight,
                            type: brickType,
                            health: health,
                            maxHealth: health,
                            isBoss: false
                        });
                    }
                }
            }
            updateBricksCount();
        }

        function checkBossLevel() {
            bossActive = (level % CONFIG.boss.spawnEvery === 0);
            if (bossActive) {
                bossHealth = CONFIG.boss.health + (level - 1) * 20;
                showBossHealth();
            } else {
                hideBossHealth();
            }
            generateBricks();
        }

        function resetBall() {
            balls = [{
                x: canvas.width / 2,
                y: canvas.height - 50,
                radius: CONFIG.ball.radius,
                dx: CONFIG.ball.baseSpeed + (level - 1) * 0.3,
                dy: -CONFIG.ball.baseSpeed - (level - 1) * 0.3
            }];
        }

        function startBall() {
            if (!ballMoving && !gameOver) {
                ballMoving = true;
                gameLoop.start();
                
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.sendData(JSON.stringify({
                        action: 'game_started',
                        score: score,
                        level: level
                    }));
                }
            }
        }

        function restartGame() {
            score = 0;
            level = 1;
            gameOver = false;
            ballMoving = false;
            activePowerups.clear();
            powerups = [];
            particles = [];
            
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('gameOver').style.display = 'none';
            
            resetBall();
            checkBossLevel();
            
            // Сброс управления
            input.keys = {};
            document.getElementById('leftBtn').classList.remove('held');
            document.getElementById('rightBtn').classList.remove('held');
            
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    action: 'game_restart'
                }));
            }
        }

        // ========== ИНИЦИАЛИЗАЦИЯ И ЗАПУСК ==========
        function init() {
            // Инициализация Telegram Web App
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.expand();
                Telegram.WebApp.enableClosingConfirmation();
                
                // Обработка данных от бота
                Telegram.WebApp.onEvent('viewportChanged', (data) => {
                    // Адаптация под размер окна
                    console.log('Viewport changed:', data);
                });
            }
            
            // Настройка кнопки рестарта
            document.getElementById('restartBtn').addEventListener('click', restartGame);
            
            // Запуск игры
            resetBall();
            checkBossLevel();
            updateHighScoreDisplay();
            
            // Начальная отрисовка
            gameLoop.render();
        }

        // Запускаем игру когда страница загружена
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Глобальные функции для кнопок
        window.startBall = startBall;
        window.restartGame = restartGame;

        // Обработка видимости страницы для паузы
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && ballMoving && !gameOver) {
                // Можно добавить паузу при скрытии вкладки
            }
        });

        // Предотвращение скролла на мобильных устройствах
        document.addEventListener('touchmove', (e) => {
            if (e.target.tagName !== 'CANVAS') {
                e.preventDefault();
            }
        }, { passive: false });

    </script>
</body>
</html>
