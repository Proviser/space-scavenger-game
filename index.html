<!DOCTYPE html>
<html>
<head>
    <title>Space Scavenger</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a2a, #1a1a4a, #2a2a6a);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* Анимированный фон */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .container {
            text-align: center;
            padding: 15px;
            max-width: 500px;
            width: 100%;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .game-title {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.5);
            font-weight: 800;
            letter-spacing: 2px;
        }
        
        .game-subtitle {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        #gameCanvas {
            display: block;
            border: 4px solid;
            border-image: linear-gradient(45deg, #ff6b6b, #4ecdc4) 1;
            border-radius: 12px;
            box-shadow: 
                0 0 40px rgba(78, 205, 196, 0.3),
                inset 0 0 40px rgba(0, 0, 0, 0.5);
            background: 
                radial-gradient(circle at 20% 50%, rgba(42, 42, 106, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 107, 107, 0.4) 0%, transparent 50%),
                #0a0a2a;
            margin: 15px auto;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-item {
            text-align: center;
            padding: 8px;
        }
        
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            padding: 0 10px;
        }
        
        .control-btn {
            padding: 14px 5px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            min-height: 50px;
        }
        
        .control-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.4);
        }
        
        .control-btn.held {
            transform: scale(0.92);
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
        
        .start-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        }
        
        .start-btn:active {
            box-shadow: 0 2px 8px rgba(78, 205, 196, 0.4);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(10, 10, 42, 0.95), rgba(26, 26, 74, 0.95));
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #4ecdc4;
            box-shadow: 0 0 50px rgba(78, 205, 196, 0.3);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 1000;
            width: 90%;
            max-width: 350px;
        }
        
        .game-over h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .restart-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #ffd93d, #ff9a3d);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 217, 61, 0.3);
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .restart-btn:active {
            transform: scale(0.95);
        }
        
        .powerup-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            display: none;
            backdrop-filter: blur(10px);
        }
        
        .boss-health {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            display: none;
        }
        
        .boss-health-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
            border-radius: 5px;
            transition: width 0.3s ease;
        }
        
        /* Адаптивность */
        @media (max-width: 400px) {
            .container {
                padding: 10px;
            }
            
            .controls {
                gap: 8px;
                padding: 0 5px;
            }
            
            .control-btn {
                padding: 12px 5px;
                font-size: 1rem;
                min-height: 45px;
            }
            
            .stats-container {
                padding: 10px;
                gap: 8px;
            }
            
            .stat-value {
                font-size: 1.2rem;
            }
        }
        
        @media (max-height: 700px) {
            .container {
                transform: scale(0.9);
            }
        }
    </style>
</head>
<body>
    <!-- Анимированные звезды на фоне -->
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="game-title">🚀 SPACE SCAVENGER</h1>
            <p class="game-subtitle">Destroy debris, collect powerups, defeat bosses!</p>
        </div>
        
        <!-- Полоска здоровья босса -->
        <div class="boss-health" id="bossHealth">
            <div class="boss-health-bar" id="bossHealthBar"></div>
        </div>
        
        <!-- Индикатор активного бустера -->
        <div class="powerup-indicator" id="powerupIndicator">
            <span id="powerupText">Powerup Active</span>
        </div>
        
        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Level</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Bricks</div>
                <div class="stat-value" id="bricks">40</div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="controls">
            <button class="control-btn" id="leftBtn" ontouchstart="startMoving('left')" 
                    ontouchend="stopMoving()" onmousedown="startMoving('left')" 
                    onmouseup="stopMoving()" onmouseleave="stopMoving()">
                ⬅️ LEFT
            </button>
            <button class="control-btn start-btn" onclick="startBall()">
                🚀 START
            </button>
            <button class="control-btn" id="rightBtn" ontouchstart="startMoving('right')" 
                    ontouchend="stopMoving()" onmousedown="startMoving('right')" 
                    onmouseup="stopMoving()" onmouseleave="stopMoving()">
                ➡️ RIGHT
            </button>
        </div>
    </div>
    
    <!-- Окно Game Over -->
    <div class="game-over" id="gameOver">
        <h2>🎮 MISSION FAILED</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Level Reached: <span id="finalLevel">1</span></p>
        <p>High Score: <span id="highScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">🔄 NEW MISSION</button>
    </div>

    <script>
        // ========== КОНФИГУРАЦИЯ ==========
        const CONFIG = {
            platform: {
                baseSpeed: 8,
                boostedSpeed: 12,
                width: 80,
                height: 15
            },
            ball: {
                baseSpeed: 4,
                maxSpeed: 8,
                radius: 8
            },
            powerups: {
                spawnChance: 0.15, // 15% шанс выпадения бустера
                types: ['speed', 'large', 'multiball', 'laser']
            },
            boss: {
                health: 100,
                spawnEvery: 3 // Каждый 3 уровень босс
            }
        };

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // Игровые переменные
        let score = 0;
        let level = 1;
        let gameOver = false;
        let ballMoving = false;
        let animationId;
        let highScore = localStorage.getItem('spaceScavengerHighScore') || 0;
        let isMoving = false;
        let moveDirection = null;
        let activePowerups = new Set();
        let bossActive = false;
        let bossHealth = CONFIG.boss.health;

        // Создаем звездный фон
        createStars();

        // Игровые объекты
        const platform = {
            width: CONFIG.platform.width,
            height: CONFIG.platform.height,
            x: canvas.width / 2 - CONFIG.platform.width / 2,
            y: canvas.height - 30,
            get speed() {
                return activePowerups.has('speed') ? CONFIG.platform.boostedSpeed : CONFIG.platform.baseSpeed;
            },
            get width() {
                return activePowerups.has('large') ? CONFIG.platform.width * 1.5 : CONFIG.platform.width;
            }
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: CONFIG.ball.radius,
            dx: CONFIG.ball.baseSpeed,
            dy: -CONFIG.ball.baseSpeed,
            get speed() {
                return activePowerups.has('speed') ? CONFIG.ball.maxSpeed : CONFIG.ball.baseSpeed;
            }
        };

        let bricks = [];
        let powerups = [];
        let balls = [ball]; // Для мультишаров

        // ========== СИСТЕМА БУСТЕРОВ ==========
        const powerupEffects = {
            speed: {
                duration: 10000,
                color: '#4ecdc4',
                apply() {
                    showPowerupIndicator('SPEED BOOST!');
                },
                remove() {
                    hidePowerupIndicator();
                }
            },
            large: {
                duration: 8000,
                color: '#ff9a3d',
                apply() {
                    showPowerupIndicator('LARGE PADDLE!');
                },
                remove() {
                    hidePowerupIndicator();
                }
            },
            multiball: {
                duration: 0, // Мгновенный эффект
                color: '#ff6b6b',
                apply() {
                    spawnExtraBalls(2);
                    showPowerupIndicator('MULTIBALL!');
                    setTimeout(hidePowerupIndicator, 2000);
                }
            },
            laser: {
                duration: 5000,
                color: '#45b7d1',
                apply() {
                    showPowerupIndicator('LASER POWER!');
                },
                remove() {
                    hidePowerupIndicator();
                }
            }
        };

        // ========== ОСНОВНЫЕ ФУНКЦИИ ==========
        function initGame() {
            generateBricks();
            checkBossLevel();
            draw();
            updateHighScoreDisplay();
        }

        function gameLoop() {
            if (gameOver) {
                cancelAnimationFrame(animationId);
                showGameOver();
                return;
            }
            
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }

        function update() {
            if (ballMoving) {
                updateMovement();
                updateBalls();
                updatePowerups();
                checkCollisions();
            }
        }

        // ========== СИСТЕМА ДВИЖЕНИЯ ==========
        function startMoving(direction) {
            isMoving = true;
            moveDirection = direction;
            updateButtonState();
        }

        function stopMoving() {
            isMoving = false;
            moveDirection = null;
            updateButtonState();
        }

        function updateMovement() {
            if (isMoving && moveDirection) {
                if (moveDirection === 'left') {
                    platform.x = Math.max(0, platform.x - platform.speed);
                } else if (moveDirection === 'right') {
                    platform.x = Math.min(canvas.width - platform.width, platform.x + platform.speed);
                }
            }
        }

        function updateButtonState() {
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            
            leftBtn.classList.toggle('held', isMoving && moveDirection === 'left');
            rightBtn.classList.toggle('held', isMoving && moveDirection === 'right');
        }

        // ========== СИСТЕМА УРОВНЕЙ И БОССОВ ==========
        function checkBossLevel() {
            bossActive = (level % CONFIG.boss.spawnEvery === 0);
            if (bossActive) {
                bossHealth = CONFIG.boss.health;
                showBossHealth();
                generateBossLevel();
            } else {
                hideBossHealth();
                generateNormalLevel();
            }
        }

        function generateBossLevel() {
            bricks = [];
            // Создаем большого босса-блока
            bricks.push({
                x: canvas.width / 2 - 100,
                y: 100,
                width: 200,
                height: 40,
                type: 4, // Особый тип для босса
                health: bossHealth,
                maxHealth: CONFIG.boss.health,
                isBoss: true
            });
            updateBricksCount();
        }

        function generateNormalLevel() {
            bricks = [];
            const rows = 4 + Math.min(level - 1, 3);
            const cols = 10;
            const brickWidth = 36;
            const brickHeight = 18;
            const padding = 4;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const brickType = row % 4;
                    const health = level >= 3 && Math.random() < 0.3 ? 2 : 1;
                    
                    bricks.push({
                        x: col * (brickWidth + padding) + padding,
                        y: row * (brickHeight + padding) + 50,
                        width: brickWidth,
                        height: brickHeight,
                        type: brickType,
                        health: health,
                        maxHealth: health,
                        isBoss: false
                    });
                }
            }
            updateBricksCount();
        }

        // ========== СИСТЕМА БУСТЕРОВ ==========
        function spawnPowerup(x, y) {
            if (Math.random() < CONFIG.powerups.spawnChance) {
                const type = CONFIG.powerups.types[Math.floor(Math.random() * CONFIG.powerups.types.length)];
                powerups.push({
                    x: x,
                    y: y,
                    width: 20,
                    height: 20,
                    type: type,
                    color: powerupEffects[type].color,
                    speed: 2
                });
            }
        }

        function activatePowerup(type) {
            const effect = powerupEffects[type];
            effect.apply();
            
            if (effect.duration > 0) {
                activePowerups.add(type);
                setTimeout(() => {
                    activePowerups.delete(type);
                    if (effect.remove) effect.remove();
                }, effect.duration);
            }
        }

        function spawnExtraBalls(count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count;
                balls.push({
                    x: ball.x,
                    y: ball.y,
                    radius: ball.radius,
                    dx: Math.cos(angle) * ball.speed,
                    dy: Math.sin(angle) * ball.speed
                });
            }
        }

        // ========== ОБНОВЛЕНИЕ И ОТРИСОВКА ==========
        function updateBalls() {
            balls.forEach(ball => {
                ball.x += ball.dx;
                ball.y += ball.dy;
                
                // Отскок от стен
                if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                    ball.dx = -ball.dx;
                }
                if (ball.y - ball.radius < 0) {
                    ball.dy = -ball.dy;
                }
            });
            
            // Удаляем шары которые улетели вниз (кроме основного)
            balls = balls.filter((b, index) => index === 0 || b.y - b.radius < canvas.height);
        }

        function updatePowerups() {
            powerups.forEach(powerup => {
                powerup.y += powerup.speed;
            });
            
            powerups = powerups.filter(powerup => powerup.y < canvas.height);
        }

        function draw() {
            // Очистка canvas
            ctx.fillStyle = '#0a0a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем игровые объекты
            drawBricks();
            drawPowerups();
            drawBalls();
            drawPlatform();
        }

        function drawBricks() {
            bricks.forEach(brick => {
                if (brick.health > 0) {
                    // Разные цвета для разных типов блоков
                    const colors = ['#A9A9A9', '#4169E1', '#32CD32', '#DC143C', '#FF6B6B'];
                    ctx.fillStyle = colors[brick.type];
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // Обводка
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // Для босса и прочных блоков показываем здоровье
                    if (brick.isBoss || brick.maxHealth > 1) {
                        const healthPercent = brick.health / brick.maxHealth;
                        ctx.fillStyle = `hsl(${healthPercent * 120}, 100%, 50%)`;
                        ctx.fillRect(brick.x, brick.y - 5, brick.width * healthPercent, 3);
                    }
                }
            });
        }

        // ========== ОСТАЛЬНЫЕ ФУНКЦИИ ==========
        // (Здесь будут остальные функции: коллизии, UI, управление и т.д.)
        // Из-за ограничения длины оставлю основные функции...

        // Запуск игры
        initGame();

        // Создание звездного фона
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 2 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
    </script>
</body>
</html>
