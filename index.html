<!DOCTYPE html>
<html>
<head>
    <title>Space Scavenger</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            font-size: 14px;
            text-shadow: 0 0 5px #0ff;
        }

        #gameMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.9);
            padding: 30px;
            border: 2px solid #0ff;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
        }

        #gameMenu h1 {
            color: #0ff;
            margin-bottom: 20px;
            font-size: 24px;
            text-shadow: 0 0 10px #0ff;
        }

        .menuBtn {
            background: #002;
            color: #0ff;
            border: 1px solid #0ff;
            padding: 12px 24px;
            margin: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            transition: all 0.2s;
        }

        .menuBtn:hover {
            background: #0ff;
            color: #002;
            box-shadow: 0 0 15px #0ff;
        }

        #touchControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .touchZone {
            width: 120px;
            height: 120px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
            <div>LIVES: <span id="lives">3</span></div>
        </div>
        
        <div id="touchControls">
            <div class="touchZone" id="leftTouch"></div>
            <div class="touchZone" id="rightTouch"></div>
        </div>

        <div id="gameMenu">
            <h1>🚀 SPACE SCAVENGER</h1>
            <button class="menuBtn" onclick="startGame()">START MISSION</button>
            <button class="menuBtn" onclick="showControls()">CONTROLS</button>
        </div>
    </div>

    <script>
        // ========== КОНСТАНТЫ И ПЕРЕМЕННЫЕ ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Размеры canvas
        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;
        
        // Игровые переменные
        let score = 0;
        let level = 1;
        let lives = 3;
        let gameRunning = false;
        let lastTime = 0;
        
        // Космический корабль игрока
        const player = {
            x: canvasWidth / 2,
            y: canvasHeight - 100,
            width: 40,
            height: 60,
            speed: 8,
            color: '#0ff',
            lasers: [],
            lastShot: 0
        };
        
        // Враги
        let enemies = [];
        let particles = [];
        let stars = [];
        
        // Управление
        const keys = {};
        const touch = { left: false, right: false };

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            resizeCanvas();
            createStars();
            setupEventListeners();
            gameLoop();
        }

        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvasWidth,
                    y: Math.random() * canvasHeight,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5
                });
            }
        }

        // ========== УПРАВЛЕНИЕ ==========
        function setupEventListeners() {
            // Клавиатура
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
                if (e.key === ' ' && gameRunning) {
                    shootLaser();
                }
            });
            
            window.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });
            
            // Сенсорное управление
            const leftTouch = document.getElementById('leftTouch');
            const rightTouch = document.getElementById('rightTouch');
            
            leftTouch.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touch.left = true;
            });
            
            leftTouch.addEventListener('touchend', (e) => {
                e.preventDefault();
                touch.left = false;
            });
            
            rightTouch.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touch.right = true;
            });
            
            rightTouch.addEventListener('touchend', (e) => {
                e.preventDefault();
                touch.right = false;
            });
            
            // Ресайз окна
            window.addEventListener('resize', resizeCanvas);
        }

        function updatePlayer(deltaTime) {
            // Движение
            if (keys['ArrowLeft'] || touch.left) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] || touch.right) {
                player.x += player.speed;
            }
            
            // Границы
            player.x = Math.max(player.width/2, Math.min(canvasWidth - player.width/2, player.x));
            
            // Автоматическая стрельба
            const now = Date.now();
            if (gameRunning && now - player.lastShot > 300) {
                shootLaser();
                player.lastShot = now;
            }
        }

        function shootLaser() {
            player.lasers.push({
                x: player.x,
                y: player.y - player.height/2,
                width: 3,
                height: 15,
                speed: 12,
                color: '#0ff'
            });
        }

        // ========== ВРАГИ ==========
        function spawnEnemy() {
            if (!gameRunning) return;
            
            const type = Math.floor(Math.random() * 3);
            const size = 20 + type * 10;
            
            enemies.push({
                x: Math.random() * (canvasWidth - size) + size/2,
                y: -size,
                width: size,
                height: size,
                speed: 2 + type,
                health: 1 + type,
                color: type === 0 ? '#f00' : type === 1 ? '#ff0' : '#f0f',
                points: (type + 1) * 100
            });
        }

        function updateEnemies(deltaTime) {
            // Движение врагов
            enemies.forEach(enemy => {
                enemy.y += enemy.speed;
            });
            
            // Удаление вышедших за экран
            enemies = enemies.filter(enemy => enemy.y < canvasHeight + enemy.height);
            
            // Спавн новых врагов
            if (Math.random() < 0.02 * level) {
                spawnEnemy();
            }
        }

        // ========== СТОЛКНОВЕНИЯ ==========
        function checkCollisions() {
            // Лазеры vs враги
            player.lasers.forEach((laser, laserIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (laser.x < enemy.x + enemy.width/2 &&
                        laser.x > enemy.x - enemy.width/2 &&
                        laser.y < enemy.y + enemy.height/2 &&
                        laser.y > enemy.y - enemy.height/2) {
                        
                        // Попадание
                        enemy.health--;
                        createExplosion(enemy.x, enemy.y, enemy.color);
                        
                        if (enemy.health <= 0) {
                            score += enemy.points;
                            enemies.splice(enemyIndex, 1);
                        }
                        
                        player.lasers.splice(laserIndex, 1);
                    }
                });
            });
            
            // Игрок vs враги
            enemies.forEach((enemy, index) => {
                if (Math.abs(player.x - enemy.x) < (player.width/2 + enemy.width/2) &&
                    Math.abs(player.y - enemy.y) < (player.height/2 + enemy.height/2)) {
                    
                    // Столкновение
                    lives--;
                    createExplosion(player.x, player.y, '#0ff');
                    enemies.splice(index, 1);
                    
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            });
        }

        // ========== ВИЗУАЛЬНЫЕ ЭФФЕКТЫ ==========
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function updateParticles(deltaTime) {
            particles.forEach(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.02;
            });
            
            particles = particles.filter(p => p.life > 0);
        }

        // ========== ОТРИСОВКА ==========
        function draw() {
            // Очистка
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            // Звезды
            drawStars();
            
            // Игрок
            drawPlayer();
            
            // Лазеры
            drawLasers();
            
            // Враги
            drawEnemies();
            
            // Частицы
            drawParticles();
            
            // UI
            updateUI();
        }

        function drawStars() {
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Корпус
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(0, -player.height/2);
            ctx.lineTo(-player.width/2, player.height/2);
            ctx.lineTo(player.width/2, player.height/2);
            ctx.closePath();
            ctx.fill();
            
            // Двигатель
            ctx.fillStyle = '#ff0';
            ctx.beginPath();
            ctx.moveTo(-10, player.height/2);
            ctx.lineTo(10, player.height/2);
            ctx.lineTo(0, player.height/2 + 15);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        function drawLasers() {
            player.lasers.forEach(laser => {
                ctx.fillStyle = laser.color;
                ctx.fillRect(laser.x - laser.width/2, laser.y, laser.width, laser.height);
            });
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                
                ctx.fillStyle = enemy.color;
                ctx.beginPath();
                
                if (enemy.points === 100) {
                    // Маленький враг - треугольник
                    ctx.moveTo(0, -enemy.height/2);
                    ctx.lineTo(-enemy.width/2, enemy.height/2);
                    ctx.lineTo(enemy.width/2, enemy.height/2);
                } else if (enemy.points === 200) {
                    // Средний враг - квадрат
                    ctx.rect(-enemy.width/2, -enemy.height/2, enemy.width, enemy.height);
                } else {
                    // Большой враг - шестиугольник
                    for (let i = 0; i < 6; i++) {
                        const angle = (i * Math.PI) / 3;
                        const x = Math.cos(angle) * enemy.width/2;
                        const y = Math.sin(angle) * enemy.height/2;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                }
                
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            });
        }

        function drawParticles() {
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
            });
            ctx.globalAlpha = 1;
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = lives;
        }

        // ========== ИГРОВОЙ ЦИКЛ ==========
        function gameLoop(currentTime = 0) {
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (gameRunning) {
                updatePlayer(deltaTime);
                updateEnemies(deltaTime);
                updateParticles(deltaTime);
                checkCollisions();
                
                // Обновление лазеров
                player.lasers.forEach(laser => {
                    laser.y -= laser.speed;
                });
                player.lasers = player.lasers.filter(laser => laser.y > 0);
                
                // Повышение уровня
                if (score >= level * 1000) {
                    level++;
                    lives++;
                }
            }
            
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ========== УПРАВЛЕНИЕ ИГРОЙ ==========
        function startGame() {
            document.getElementById('gameMenu').style.display = 'none';
            score = 0;
            level = 1;
            lives = 3;
            player.x = canvasWidth / 2;
            player.lasers = [];
            enemies = [];
            particles = [];
            gameRunning = true;
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('gameMenu').style.display = 'block';
            document.getElementById('gameMenu').innerHTML = `
                <h1>MISSION FAILED</h1>
                <p>Final Score: ${score}</p>
                <button class="menuBtn" onclick="startGame()">TRY AGAIN</button>
            `;
        }

        function showControls() {
            document.getElementById('gameMenu').innerHTML = `
                <h1>CONTROLS</h1>
                <p>← → : Move</p>
                <p>SPACE : Auto Fire</p>
                <p>Touch Zones : Mobile</p>
                <button class="menuBtn" onclick="startGame()">PLAY</button>
            `;
        }

        // Запуск игры
        window.addEventListener('load', init);
    </script>
</body>
</html>
