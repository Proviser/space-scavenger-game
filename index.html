<!DOCTYPE html>
<html>
<head>
    <title>Space Scavenger</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #000;
            color: #0ff;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: none;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            font-size: 14px;
            text-shadow: 0 0 5px #0ff;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
        }

        #bossHealth {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: rgba(255,0,0,0.3);
            border: 2px solid #f00;
            display: none;
            z-index: 100;
            border-radius: 10px;
            overflow: hidden;
        }

        #bossHealthBar {
            height: 100%;
            background: linear-gradient(90deg, #f00, #ff0);
            width: 100%;
            transition: width 0.3s;
        }

        #powerupIndicator {
            position: absolute;
            top: 80px;
            left: 10px;
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
        }

        #levelProgress {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
            text-align: right;
        }

        #gameMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 40, 0.95);
            padding: 30px;
            border: 2px solid #0ff;
            border-radius: 15px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 50px #0ff;
            min-width: 300px;
        }

        .menuSection {
            margin: 20px 0;
        }

        .menuTitle {
            color: #0ff;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 0 0 10px #0ff;
        }

        .skinSelector, .backgroundSelector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .skinOption, .bgOption {
            width: 60px;
            height: 60px;
            border: 2px solid #0ff;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .skinOption.selected, .bgOption.selected {
            border-color: #ff0;
            box-shadow: 0 0 15px #ff0;
            transform: scale(1.1);
        }

        .menuBtn {
            background: #002;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 12px 24px;
            margin: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            transition: all 0.3s;
            border-radius: 8px;
        }

        .menuBtn:hover {
            background: #0ff;
            color: #002;
            box-shadow: 0 0 20px #0ff;
        }

        #touchControls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .touchZone {
            width: 80px;
            height: 80px;
            background: rgba(0, 255, 255, 0.2);
            border: 2px solid #0ff;
            border-radius: 50%;
            backdrop-filter: blur(10px);
        }

        .upgradeDisplay {
            position: absolute;
            bottom: 120px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
        }

        .upgradeIcon {
            display: inline-block;
            width: 20px;
            height: 20px;
            text-align: center;
            margin: 0 2px;
            border: 1px solid #0ff;
            border-radius: 3px;
            line-height: 18px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
            <div>LIVES: <span id="lives">3</span></div>
            <div>ENEMIES: <span id="enemiesLeft">10</span></div>
        </div>
        
        <div id="levelProgress">
            <div>PROGRESS: <span id="progress">0%</span></div>
            <div>WEAPON: <span id="weaponLevel">1</span></div>
        </div>
        
        <div id="bossHealth">
            <div id="bossHealthBar"></div>
        </div>
        
        <div id="powerupIndicator"></div>
        
        <div class="upgradeDisplay">
            UPGRADES: <span id="upgradeIcons"></span>
        </div>

        <div id="touchControls">
            <div class="touchZone" id="leftTouch"></div>
            <div class="touchZone" id="rightTouch"></div>
        </div>

        <div id="gameMenu">
            <div class="menuTitle">🚀 SPACE SCAVENGER</div>
            
            <div class="menuSection">
                <div>SELECT SHIP:</div>
                <div class="skinSelector">
                    <div class="skinOption selected" data-skin="default">🚀</div>
                    <div class="skinOption" data-skin="fighter">🛸</div>
                    <div class="skinOption" data-skin="cruiser">🛰️</div>
                    <div class="skinOption" data-skin="interceptor">⚡</div>
                </div>
            </div>
            
            <div class="menuSection">
                <div>SELECT BACKGROUND:</div>
                <div class="backgroundSelector">
                    <div class="bgOption selected" data-bg="nebula">🌌</div>
                    <div class="bgOption" data-bg="stars">✨</div>
                    <div class="bgOption" data-bg="galaxy">🌀</div>
                </div>
            </div>
            
            <button class="menuBtn" onclick="startGame()">START MISSION</button>
        </div>
    </div>

    <script>
        // ========== КОНСТАНТЫ И ПЕРЕМЕННЫЕ ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let canvasWidth = window.innerWidth;
        let canvasHeight = window.innerHeight;
        
        // Настройки игры
        let score = 0;
        let level = 1;
        let lives = 3;
        let gameRunning = false;
        let lastTime = 0;
        let bossActive = false;
        let enemiesToSpawn = 10;
        let enemiesDestroyed = 0;
        let backgroundType = 'nebula';
        
        // Система улучшений
        const upgrades = {
            weapon: 1,
            speed: 1,
            shield: 0
        };
        
        const weaponLevels = {
            1: { damage: 1, fireRate: 400, pattern: 'single', color: '#0ff' },
            2: { damage: 1, fireRate: 350, pattern: 'double', color: '#0ff' },
            3: { damage: 2, fireRate: 300, pattern: 'double', color: '#ff0' },
            4: { damage: 2, fireRate: 250, pattern: 'spread', color: '#ff0' },
            5: { damage: 3, fireRate: 200, pattern: 'spread', color: '#f0f' }
        };
        
        // Космический корабль игрока
        const player = {
            x: canvasWidth / 2,
            y: canvasHeight - 100,
            width: 50,
            height: 70,
            speed: 8,
            skin: 'default',
            lasers: [],
            lastShot: 0,
            invulnerable: 0
        };
        
        // Игровые объекты
        let enemies = [];
        let powerups = [];
        let particles = [];
        let stars = [];
        let nebulae = [];
        let enemyLasers = [];
        
        // Управление
        const keys = {};
        const touch = { left: false, right: false };

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            resizeCanvas();
            createBackground();
            setupEventListeners();
            setupMenu();
            gameLoop();
        }

        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
        }

        function createBackground() {
            stars = [];
            nebulae = [];
            
            // Создание звезд
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvasWidth,
                    y: Math.random() * canvasHeight,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.5 + 0.1,
                    brightness: Math.random() * 0.8 + 0.2,
                    twinkle: Math.random() * 0.1
                });
            }
            
            // Создание туманностей для nebula фона
            if (backgroundType === 'nebula') {
                for (let i = 0; i < 5; i++) {
                    nebulae.push({
                        x: Math.random() * canvasWidth,
                        y: Math.random() * canvasHeight,
                        radius: Math.random() * 100 + 50,
                        color: `hsl(${Math.random() * 60 + 200}, 70%, 30%)`,
                        alpha: Math.random() * 0.3 + 0.1
                    });
                }
            }
        }

        function setupMenu() {
            // Обработчики выбора скина
            document.querySelectorAll('.skinOption').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.skinOption').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    player.skin = this.dataset.skin;
                });
            });
            
            // Обработчики выбора фона
            document.querySelectorAll('.bgOption').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.bgOption').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    backgroundType = this.dataset.bg;
                    createBackground();
                });
            });
        }

        // ========== УПРАВЛЕНИЕ ==========
        function setupEventListeners() {
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
            });
            
            window.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });
            
            // Сенсорное управление
            const leftTouch = document.getElementById('leftTouch');
            const rightTouch = document.getElementById('rightTouch');
            
            ['touchstart', 'mousedown'].forEach(event => {
                leftTouch.addEventListener(event, (e) => {
                    e.preventDefault();
                    touch.left = true;
                });
                
                rightTouch.addEventListener(event, (e) => {
                    e.preventDefault();
                    touch.right = true;
                });
            });
            
            ['touchend', 'mouseup', 'mouseleave'].forEach(event => {
                leftTouch.addEventListener(event, (e) => {
                    e.preventDefault();
                    touch.left = false;
                });
                
                rightTouch.addEventListener(event, (e) => {
                    e.preventDefault();
                    touch.right = false;
                });
            });
            
            window.addEventListener('resize', resizeCanvas);
        }

        function updatePlayer(deltaTime) {
            // Движение
            let moveSpeed = player.speed * upgrades.speed;
            if (keys['ArrowLeft'] || touch.left) {
                player.x -= moveSpeed;
            }
            if (keys['ArrowRight'] || touch.right) {
                player.x += moveSpeed;
            }
            
            // Границы
            player.x = Math.max(player.width/2, Math.min(canvasWidth - player.width/2, player.x));
            
            // Автоматическая стрельба
            const now = Date.now();
            const weapon = weaponLevels[upgrades.weapon];
            if (gameRunning && now - player.lastShot > weapon.fireRate) {
                shootLaser();
                player.lastShot = now;
            }
            
            // Неуязвимость после попадания
            if (player.invulnerable > 0) {
                player.invulnerable -= deltaTime;
            }
        }

        function shootLaser() {
            const weapon = weaponLevels[upgrades.weapon];
            
            switch(weapon.pattern) {
                case 'single':
                    player.lasers.push(createLaser(player.x, player.y, weapon.damage, weapon.color));
                    break;
                    
                case 'double':
                    player.lasers.push(createLaser(player.x - 12, player.y, weapon.damage, weapon.color));
                    player.lasers.push(createLaser(player.x + 12, player.y, weapon.damage, weapon.color));
                    break;
                    
                case 'spread':
                    player.lasers.push(createLaser(player.x - 15, player.y, weapon.damage, weapon.color, -0.1));
                    player.lasers.push(createLaser(player.x, player.y, weapon.damage, weapon.color, 0));
                    player.lasers.push(createLaser(player.x + 15, player.y, weapon.damage, weapon.color, 0.1));
                    break;
            }
        }

        function createLaser(x, y, damage, color, angle = 0) {
            return {
                x: x,
                y: y - player.height/2,
                width: 4,
                height: 12,
                speed: 12,
                damage: damage,
                color: color,
                angle: angle
            };
        }

        // ========== ВРАГИ И БОССЫ ==========
        function spawnEnemy() {
            if (!gameRunning || enemiesToSpawn <= 0) return;
            
            enemiesToSpawn--;
            
            const type = Math.floor(Math.random() * 3);
            const size = 30 + type * 10;
            const colors = ['#f00', '#ff0', '#0f0'];
            const points = [50, 100, 150];
            
            enemies.push({
                x: Math.random() * (canvasWidth - size) + size/2,
                y: -size,
                width: size,
                height: size,
                speed: 1 + type * 0.3,
                health: 1 + type,
                maxHealth: 1 + type,
                color: colors[type],
                points: points[type],
                lastShot: 0
            });
        }

        function spawnBoss() {
            bossActive = true;
            document.getElementById('bossHealth').style.display = 'block';
            
            const bossSize = 80;
            enemies.push({
                x: canvasWidth / 2,
                y: -bossSize,
                width: bossSize,
                height: bossSize,
                speed: 0.5,
                health: 20 + level * 5,
                maxHealth: 20 + level * 5,
                color: '#ff4500',
                points: 1000,
                isBoss: true,
                lastShot: 0,
                movePattern: 0,
                moveTimer: 0
            });
        }

        function updateEnemies(deltaTime) {
            // Спавн врагов
            if (enemies.length < 3 + level && enemiesToSpawn > 0 && Math.random() < 0.02) {
                spawnEnemy();
            }
            
            enemies.forEach(enemy => {
                // Движение
                if (enemy.isBoss) {
                    // Движение босса
                    enemy.moveTimer += deltaTime;
                    if (enemy.moveTimer > 2) {
                        enemy.movePattern = (enemy.movePattern + 1) % 3;
                        enemy.moveTimer = 0;
                    }
                    
                    switch(enemy.movePattern) {
                        case 0:
                            enemy.x = canvasWidth/2 + Math.sin(Date.now() * 0.001) * 150;
                            enemy.y = Math.min(100, enemy.y + enemy.speed);
                            break;
                        case 1:
                            enemy.x += Math.sin(Date.now() * 0.002) * 2;
                            break;
                        case 2:
                            enemy.x = canvasWidth/2;
                            break;
                    }
                    
                    // Стрельба босса
                    const now = Date.now();
                    if (now - enemy.lastShot > 1500) {
                        shootBossLaser(enemy);
                        enemy.lastShot = now;
                    }
                } else {
                    enemy.y += enemy.speed;
                    
                    // Рандомная стрельба обычных врагов
                    if (Math.random() < 0.003) {
                        shootEnemyLaser(enemy);
                    }
                }
            });
            
            // Удаление вышедших за экран
            enemies = enemies.filter(enemy => enemy.y < canvasHeight + enemy.height);
            
            // Проверка конца уровня
            if (enemiesToSpawn <= 0 && enemies.length === 0 && !bossActive) {
                // Спавн босса в конце уровня
                spawnBoss();
            }
            
            // Обновление здоровья босса
            if (bossActive) {
                const boss = enemies.find(e => e.isBoss);
                if (boss) {
                    const healthPercent = (boss.health / boss.maxHealth) * 100;
                    document.getElementById('bossHealthBar').style.width = healthPercent + '%';
                }
            }
        }

        function shootEnemyLaser(enemy) {
            enemyLasers.push({
                x: enemy.x,
                y: enemy.y + enemy.height/2,
                vx: (Math.random() - 0.5) * 2,
                vy: 4,
                damage: 1,
                color: enemy.color
            });
        }

        function shootBossLaser(boss) {
            // Босс стреляет веером
            for (let i = -1; i <= 1; i++) {
                enemyLasers.push({
                    x: boss.x,
                    y: boss.y + boss.height/2,
                    vx: i * 1.5,
                    vy: 3,
                    damage: 2,
                    color: '#ff4500'
                });
            }
        }

        // ========== УЛУЧШЕНИЯ ==========
        function spawnPowerup(x, y) {
            const types = ['weapon', 'speed', 'shield'];
            const type = types[Math.floor(Math.random() * types.length)];
            const icons = { 'weapon': '⚡', 'speed': '💨', 'shield': '🛡️' };
            const colors = { 'weapon': '#ff0', 'speed': '#0ff', 'shield': '#0f0' };
            
            powerups.push({
                x: x,
                y: y,
                width: 25,
                height: 25,
                type: type,
                icon: icons[type],
                color: colors[type],
                speed: 2
            });
        }

        function activatePowerup(type) {
            const indicator = document.getElementById('powerupIndicator');
            
            switch(type) {
                case 'weapon':
                    if (upgrades.weapon < 5) {
                        upgrades.weapon++;
                        indicator.textContent = `WEAPON UPGRADED! LEVEL ${upgrades.weapon}`;
                    } else {
                        indicator.textContent = 'WEAPON MAX LEVEL!';
                    }
                    break;
                    
                case 'speed':
                    upgrades.speed += 0.2;
                    indicator.textContent = `SPEED BOOST! ${upgrades.speed.toFixed(1)}x`;
                    break;
                    
                case 'shield':
                    upgrades.shield++;
                    indicator.textContent = `SHIELD UP! ${upgrades.shield} LAYERS`;
                    break;
            }
            
            indicator.style.color = type === 'weapon' ? '#ff0' : type === 'speed' ? '#0ff' : '#0f0';
            indicator.style.display = 'block';
            
            // Обновление иконок улучшений
            updateUpgradeIcons();
            
            setTimeout(() => {
                indicator.style.display = 'none';
            }, 2000);
        }

        function updateUpgradeIcons() {
            const container = document.getElementById('upgradeIcons');
            container.innerHTML = '';
            
            // Оружие
            for (let i = 0; i < upgrades.weapon; i++) {
                const icon = document.createElement('span');
                icon.className = 'upgradeIcon';
                icon.textContent = '⚡';
                icon.style.color = i < 3 ? '#0ff' : i < 5 ? '#ff0' : '#f0f';
                container.appendChild(icon);
            }
            
            // Скорость
            if (upgrades.speed > 1) {
                const icon = document.createElement('span');
                icon.className = 'upgradeIcon';
                icon.textContent = '💨';
                container.appendChild(icon);
            }
            
            // Щит
            for (let i = 0; i < upgrades.shield; i++) {
                const icon = document.createElement('span');
                icon.className = 'upgradeIcon';
                icon.textContent = '🛡️';
                container.appendChild(icon);
            }
        }

        // ========== СТОЛКНОВЕНИЯ ==========
        function checkCollisions() {
            // Лазеры игрока vs враги
            player.lasers.forEach((laser, laserIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (laser.x < enemy.x + enemy.width/2 &&
                        laser.x > enemy.x - enemy.width/2 &&
                        laser.y < enemy.y + enemy.height/2 &&
                        laser.y > enemy.y - enemy.height/2) {
                        
                        enemy.health -= laser.damage;
                        createExplosion(laser.x, laser.y, laser.color);
                        
                        if (enemy.health <= 0) {
                            score += enemy.points;
                            enemiesDestroyed++;
                            
                            // Шанс выпадения улучшения
                            if (Math.random() < 0.4) {
                                spawnPowerup(enemy.x, enemy.y);
                            }
                            
                            // Убийство босса
                            if (enemy.isBoss) {
                                bossActive = false;
                                document.getElementById('bossHealth').style.display = 'none';
                                score += 2000;
                                level++;
                                startLevel();
                                createBossExplosion(enemy.x, enemy.y);
                            }
                            
                            enemies.splice(enemyIndex, 1);
                        }
                        
                        player.lasers.splice(laserIndex, 1);
                    }
                });
            });
            
            // Лазеры врагов vs игрок
            if (player.invulnerable <= 0) {
                enemyLasers.forEach((laser, index) => {
                    if (Math.abs(laser.x - player.x) < (player.width/2 + 5) &&
                        Math.abs(laser.y - player.y) < (player.height/2 + 5)) {
                        
                        if (upgrades.shield > 0) {
                            upgrades.shield--;
                            createExplosion(player.x, player.y, '#0f0');
                        } else {
                            lives--;
                            createExplosion(player.x, player.y, '#f00');
                            player.invulnerable = 2; // 2 секунды неуязвимости
                        }
                        
                        enemyLasers.splice(index, 1);
                        updateUpgradeIcons();
                        
                        if (lives <= 0) {
                            gameOver();
                        }
                    }
                });
            }
            
            // Улучшения vs игрок
            powerups.forEach((powerup, index) => {
                if (Math.abs(powerup.x - player.x) < (player.width/2 + powerup.width/2) &&
                    Math.abs(powerup.y - player.y) < (player.height/2 + powerup.height/2)) {
                    
                    activatePowerup(powerup.type);
                    powerups.splice(index, 1);
                }
            });
        }

        // ========== ВИЗУАЛЬНЫЕ ЭФФЕКТЫ ==========
        function createExplosion(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        function createBossExplosion(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 2,
                    color: '#ff4500',
                    size: Math.random() * 6 + 3
                });
            }
        }

        function updateParticles(deltaTime) {
            particles.forEach(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.02;
            });
            
            particles = particles.filter(p => p.life > 0);
        }

        function updateEnemyLasers() {
            enemyLasers.forEach(laser => {
                laser.x += laser.vx;
                laser.y += laser.vy;
            });
            
            enemyLasers = enemyLasers.filter(laser => 
                laser.y < canvasHeight && laser.y > 0 && 
                laser.x > 0 && laser.x < canvasWidth
            );
        }

        // ========== ОТРИСОВКА ==========
        function draw() {
            // Очистка
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            drawBackground();
            drawPlayer();
            drawEnemies();
            drawLasers();
            drawEnemyLasers();
            drawPowerups();
            drawParticles();
            updateUI();
        }

        function drawBackground() {
            // Рисование туманностей
            if (backgroundType === 'nebula') {
                nebulae.forEach(nebula => {
                    ctx.save();
                    ctx.globalAlpha = nebula.alpha;
                    const gradient = ctx.createRadialGradient(
                        nebula.x, nebula.y, 0,
                        nebula.x, nebula.y, nebula.radius
                    );
                    gradient.addColorStop(0, nebula.color);
                    gradient.addColorStop(1, 'transparent');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(nebula.x, nebula.y, nebula.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }
            
            // Рисование звезд
            stars.forEach(star => {
                const brightness = star.brightness + Math.sin(Date.now() * star.twinkle) * 0.3;
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
        }

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Неуязвимость - мигание
            if (player.invulnerable > 0 && Math.floor(player.invulnerable * 10) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            
            // Разные скины корабля
            switch(player.skin) {
                case 'fighter':
                    drawFighterSkin();
                    break;
                case 'cruiser':
                    drawCruiserSkin();
                    break;
                case 'interceptor':
                    drawInterceptorSkin();
                    break;
                default:
                    drawDefaultSkin();
            }
            
            ctx.restore();
        }

        function drawDefaultSkin() {
            // Основной корпус
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.moveTo(0, -player.height/2);
            ctx.lineTo(-player.width/3, player.height/4);
            ctx.lineTo(-player.width/2, player.height/2);
            ctx.lineTo(player.width/2, player.height/2);
            ctx.lineTo(player.width/3, player.height/4);
            ctx.closePath();
            ctx.fill();
            
            // Кабина
            ctx.fillStyle = '#8ef';
            ctx.beginPath();
            ctx.arc(0, -player.height/6, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Двигатели
            drawEngineEffect();
        }

        function drawFighterSkin() {
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.moveTo(0, -player.height/2);
            ctx.lineTo(-player.width/2, player.height/4);
            ctx.lineTo(-player.width/4, player.height/2);
            ctx.lineTo(player.width/4, player.height/2);
            ctx.lineTo(player.width/2, player.height/4);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#ff8e8e';
            ctx.fillRect(-8, -10, 16, 8);
            drawEngineEffect();
        }

        function drawCruiserSkin() {
            ctx.fillStyle = '#4ecdc4';
            ctx.fillRect(-player.width/2, -player.height/3, player.width, player.height/1.5);
            
            ctx.fillStyle = '#88e0d6';
            ctx.fillRect(-15, -20, 30, 10);
            drawEngineEffect();
        }

        function drawInterceptorSkin() {
            ctx.fillStyle = '#ffd93d';
            ctx.beginPath();
            ctx.moveTo(0, -player.height/2);
            ctx.lineTo(-player.width/2, 0);
            ctx.lineTo(-player.width/4, player.height/2);
            ctx.lineTo(player.width/4, player.height/2);
            ctx.lineTo(player.width/2, 0);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#ffeaa7';
            ctx.fillRect(-6, -15, 12, 6);
            drawEngineEffect();
        }

        function drawEngineEffect() {
            ctx.fillStyle = Date.now() % 200 < 100 ? '#ff0' : '#f90';
            ctx.beginPath();
            ctx.moveTo(-12, player.height/2);
            ctx.lineTo(0, player.height/2 + 25);
            ctx.lineTo(12, player.height/2);
            ctx.closePath();
            ctx.fill();
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.save();
                ctx.translate(enemy.x, enemy.y);
                
                if (enemy.isBoss) {
                    // Босс
                    ctx.fillStyle = enemy.color;
                    ctx.beginPath();
                    
                    // Основной корпус
                    ctx.arc(0, 0, enemy.width/2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Броня
                    ctx.fillStyle = '#d73400';
                    for (let i = 0; i < 8; i++) {
                        const angle = (i * Math.PI) / 4;
                        const x = Math.cos(angle) * enemy.width/2.5;
                        const y = Math.sin(angle) * enemy.width/2.5;
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                } else {
                    // Обычные враги
                    ctx.fillStyle = enemy.color;
                    ctx.beginPath();
                    
                    if (enemy.points === 50) {
                        // Маленький враг
                        ctx.moveTo(0, -enemy.height/2);
                        ctx.lineTo(-enemy.width/2, enemy.height/2);
                        ctx.lineTo(enemy.width/2, enemy.height/2);
                    } else if (enemy.points === 100) {
                        // Средний враг
                        ctx.arc(0, 0, enemy.width/2, 0, Math.PI * 2);
                    } else {
                        // Большой враг
                        ctx.moveTo(0, -enemy.height/2);
                        ctx.lineTo(-enemy.width/2, -enemy.height/4);
                        ctx.lineTo(-enemy.width/2, enemy.height/2);
                        ctx.lineTo(enemy.width/2, enemy.height/2);
                        ctx.lineTo(enemy.width/2, -enemy.height/4);
                    }
                    
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            });
        }

        function drawLasers() {
            player.lasers.forEach(laser => {
                ctx.save();
                ctx.translate(laser.x, laser.y);
                ctx.rotate(laser.angle);
                
                ctx.fillStyle = laser.color;
                ctx.fillRect(-laser.width/2, -laser.height/2, laser.width, laser.height);
                
                // Свечение
                ctx.fillStyle = '#fff';
                ctx.fillRect(-laser.width/4, -laser.height/4, laser.width/2, laser.height/2);
                
                ctx.restore();
            });
        }

        function drawEnemyLasers() {
            enemyLasers.forEach(laser => {
                ctx.fillStyle = laser.color;
                ctx.beginPath();
                ctx.arc(laser.x, laser.y, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // След
                ctx.fillStyle = laser.color + '40';
                ctx.beginPath();
                ctx.arc(laser.x - laser.vx, laser.y - laser.vy, 2, 0, Math.PI * 2);
                ctx.fill();
            });
        }

                function drawPowerups() {
            powerups.forEach(powerup => {
                ctx.save();
                ctx.translate(powerup.x, powerup.y);
                
                // Анимация пульсации
                const scale = 1 + Math.sin(Date.now() * 0.01) * 0.2;
                ctx.scale(scale, scale);
                
                // Фон
                ctx.fillStyle = powerup.color + '40';
                ctx.beginPath();
                ctx.arc(0, 0, powerup.width/2, 0, Math.PI * 2);
                ctx.fill();
                
                // Основной круг
                ctx.fillStyle = powerup.color;
                ctx.beginPath();
                ctx.arc(0, 0, powerup.width/2 - 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Иконка
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(powerup.icon, 0, 0);
                
                ctx.restore();
            });
        }

        function drawParticles() {
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Второй слой для свечения
                ctx.globalAlpha = particle.life * 0.5;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size * 0.6, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = lives;
            document.getElementById('weaponLevel').textContent = upgrades.weapon;
            
            // Прогресс уровня
            const totalEnemies = 10 + (level - 1) * 2;
            const progress = Math.min(100, Math.floor((enemiesDestroyed / totalEnemies) * 100));
            document.getElementById('progress').textContent = progress + '%';
            document.getElementById('enemiesLeft').textContent = Math.max(0, totalEnemies - enemiesDestroyed);
        }

        // ========== ИГРОВОЙ ЦИКЛ ==========
        function gameLoop(currentTime = 0) {
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (gameRunning) {
                updatePlayer(deltaTime);
                updateEnemies(deltaTime);
                updateParticles(deltaTime);
                updateEnemyLasers();
                
                // Обновление лазеров игрока
                player.lasers.forEach(laser => {
                    laser.y -= laser.speed;
                    laser.x += Math.sin(laser.angle) * 3;
                });
                player.lasers = player.lasers.filter(laser => laser.y > 0);
                
                // Обновление бустеров
                powerups.forEach(powerup => {
                    powerup.y += powerup.speed;
                });
                powerups = powerups.filter(powerup => powerup.y < canvasHeight);
                
                checkCollisions();
                
                // Обновление звездного фона
                updateStars(deltaTime);
            }
            
            draw();
            requestAnimationFrame(gameLoop);
        }

        function updateStars(deltaTime) {
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvasHeight) {
                    star.y = 0;
                    star.x = Math.random() * canvasWidth;
                }
            });
        }

        // ========== УПРАВЛЕНИЕ ИГРОЙ ==========
        function startGame() {
            document.getElementById('gameMenu').style.display = 'none';
            resetGame();
            startLevel();
            gameRunning = true;
        }

        function resetGame() {
            score = 0;
            level = 1;
            lives = 3;
            player.x = canvasWidth / 2;
            player.lasers = [];
            enemyLasers = [];
            enemies = [];
            powerups = [];
            particles = [];
            bossActive = false;
            upgrades.weapon = 1;
            upgrades.speed = 1;
            upgrades.shield = 0;
            player.invulnerable = 0;
            document.getElementById('bossHealth').style.display = 'none';
            document.getElementById('powerupIndicator').style.display = 'none';
            updateUpgradeIcons();
        }

        function startLevel() {
            enemiesToSpawn = 10 + (level - 1) * 2;
            enemiesDestroyed = 0;
            bossActive = false;
            document.getElementById('bossHealth').style.display = 'none';
            
            // Спавн начальных врагов
            for (let i = 0; i < 3; i++) {
                setTimeout(() => spawnEnemy(), i * 500);
            }
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('gameMenu').style.display = 'block';
            document.getElementById('gameMenu').innerHTML = `
                <div class="menuTitle">MISSION FAILED</div>
                <div class="menuSection">
                    <p>Final Score: ${score}</p>
                    <p>Level Reached: ${level}</p>
                    <p>Total Kills: ${enemiesDestroyed}</p>
                </div>
                <button class="menuBtn" onclick="startGame()">TRY AGAIN</button>
            `;
        }

        function levelComplete() {
            // Можно добавить анимацию завершения уровня
            setTimeout(() => {
                startLevel();
            }, 2000);
        }

        // Запуск игры
        window.addEventListener('load', init);
    </script>
</body>
</html>
