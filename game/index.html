<!DOCTYPE html>
<html>
<head>
    <title>Space Scavenger</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c2e, #1a1a4a);
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 20px;
        }
        
        .game-title {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.5);
        }
        
        .game-subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        
        #gameCanvas {
            border: 3px solid #4ecdc4;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
            background: #000;
            margin: 20px 0;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            width: 400px;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #4ecdc4;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        
        .control-btn {
            padding: 12px 25px;
            font-size: 1.1em;
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }
        
        .control-btn:active {
            transform: translateY(0);
        }
        
        .start-btn {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            box-shadow: 0 4px 15px rgba(78, 205, 196, 0.3);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #4ecdc4;
            display: none;
        }
        
        .restart-btn {
            padding: 12px 30px;
            font-size: 1.1em;
            background: linear-gradient(45deg, #ffd93d, #ff9a3d);
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(255, 217, 61, 0.3);
        }
        
        .instructions {
            margin-top: 20px;
            opacity: 0.7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="game-title">🚀 SPACE SCAVENGER</h1>
        <p class="game-subtitle">Clean the orbit from space debris!</p>
        
        <div class="stats">
            <div class="stat-item">
                <div>SCORE</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-item">
                <div>LEVEL</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-item">
                <div>BRICKS</div>
                <div class="stat-value" id="bricks">40</div>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        
        <div class="controls">
            <button class="control-btn" onclick="moveLeft()">⬅️ LEFT</button>
            <button class="control-btn start-btn" onclick="startBall()">🔄 START BALL</button>
            <button class="control-btn" onclick="moveRight()">➡️ RIGHT</button>
        </div>
        
        <p class="instructions">
            Use buttons or keyboard: ← → arrows to move, SPACE to start
        </p>
    </div>
    
    <div class="game-over" id="gameOver">
        <h2>🎮 GAME OVER</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>Level Reached: <span id="finalLevel">1</span></p>
        <button class="restart-btn" onclick="restartGame()">🔄 PLAY AGAIN</button>
    </div>

    <script>
        // Telegram Web App initialization
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.expand();
            Telegram.WebApp.enableClosingConfirmation();
        }

        // Game variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let level = 1;
        let gameOver = false;
        let ballMoving = false;
        let animationId;
        
        // Platform
        const platform = {
            width: 80,
            height: 15,
            x: canvas.width / 2 - 40,
            y: canvas.height - 30,
            speed: 8
        };
        
        // Ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 8,
            dx: 3,
            dy: -3
        };
        
        // Bricks
        let bricks = [];
        const brickColors = ['#A9A9A9', '#4169E1', '#32CD32', '#DC143C'];
        const brickPoints = [10, 20, 50, 100];
        
        // Initialize game
        function initGame() {
            generateBricks();
            draw();
            
            // Send initial data to Telegram
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    action: 'game_started',
                    score: score,
                    level: level
                }));
            }
        }
        
        // Generate bricks
        function generateBricks() {
            bricks = [];
            const rows = 4 + level - 1;
            const cols = 10;
            const brickWidth = 36;
            const brickHeight = 18;
            const padding = 4;
            
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const brickType = row % brickColors.length;
                    bricks.push({
                        x: col * (brickWidth + padding) + padding,
                        y: row * (brickHeight + padding) + 50,
                        width: brickWidth,
                        height: brickHeight,
                        type: brickType,
                        hits: 1,
                        active: true
                    });
                }
            }
            updateBricksCount();
        }
        
        // Main game loop
        function gameLoop() {
            if (gameOver) {
                cancelAnimationFrame(animationId);
                showGameOver();
                return;
            }
            
            if (ballMoving) {
                updateBall();
            }
            
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }
        
        // Update ball position and check collisions
        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // Wall collisions
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            
            // Platform collision
            if (ball.y + ball.radius > platform.y && 
                ball.y - ball.radius < platform.y + platform.height &&
                ball.x > platform.x && 
                ball.x < platform.x + platform.width) {
                ball.dy = -Math.abs(ball.dy);
            }
            
            // Brick collisions
            let brickHit = false;
            bricks.forEach(brick => {
                if (brick.active && checkCollision(ball, brick)) {
                    brick.hits--;
                    if (brick.hits <= 0) {
                        brick.active = false;
                        score += brickPoints[brick.type];
                        document.getElementById('score').textContent = score;
                        updateBricksCount();
                    }
                    ball.dy = -ball.dy;
                    brickHit = true;
                }
            });
            
            // Game over check
            if (ball.y - ball.radius > canvas.height) {
                gameOver = true;
                return;
            }
            
            // Level complete check
            const activeBricks = bricks.filter(brick => brick.active).length;
            if (activeBricks === 0) {
                levelComplete();
            }
        }
        
        // Check collision between ball and brick
        function checkCollision(ball, brick) {
            return ball.x + ball.radius > brick.x &&
                   ball.x - ball.radius < brick.x + brick.width &&
                   ball.y + ball.radius > brick.y &&
                   ball.y - ball.radius < brick.y + brick.height;
        }
        
        // Level complete
        function levelComplete() {
            level++;
            score += 500;
            document.getElementById('level').textContent = level;
            document.getElementById('score').textContent = score;
            resetBall();
            ballMoving = false;
            generateBricks();
            
            // Send level complete to Telegram
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    action: 'level_complete',
                    score: score,
                    level: level
                }));
            }
        }
        
        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            drawStars();
            
            // Draw bricks
            bricks.forEach(brick => {
                if (brick.active) {
                    ctx.fillStyle = brickColors[brick.type];
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // Draw border
                    ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // Draw crack for damaged bricks
                    if (brick.hits === 1) {
                        ctx.strokeStyle = '#FFF';
                        ctx.beginPath();
                        ctx.moveTo(brick.x + 5, brick.y + 5);
                        ctx.lineTo(brick.x + brick.width - 5, brick.y + brick.height - 5);
                        ctx.stroke();
                    }
                }
            });
            
            // Draw platform
            ctx.fillStyle = '#8A2BE2';
            ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            
            // Draw ball
            ctx.fillStyle = '#FF4444';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Draw star background
        function drawStars() {
            ctx.fillStyle = '#FFF';
            for (let i = 0; i < 50; i++) {
                const x = (i * 13) % canvas.width;
                const y = (i * 7) % (canvas.height / 2);
                const size = Math.random() * 1.5 + 0.5;
                ctx.fillRect(x, y, size, size);
            }
        }
        
        // Update bricks count display
        function updateBricksCount() {
            const activeBricks = bricks.filter(brick => brick.active).length;
            document.getElementById('bricks').textContent = activeBricks;
        }
        
        // Reset ball to starting position
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.dx = 3 + (level - 1) * 0.5;
            ball.dy = -3 - (level - 1) * 0.5;
        }
        
        // Show game over screen
        function showGameOver() {
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('gameOver').style.display = 'block';
            
            // Send game over to Telegram
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    action: 'game_over',
                    score: score,
                    level: level
                }));
            }
        }
        
        // Control functions
        function moveLeft() {
            platform.x = Math.max(0, platform.x - platform.speed);
        }
        
        function moveRight() {
            platform.x = Math.min(canvas.width - platform.width, platform.x + platform.speed);
        }
        
        function startBall() {
            if (!ballMoving && !gameOver) {
                ballMoving = true;
                gameLoop();
            }
        }
        
        function restartGame() {
            score = 0;
            level = 1;
            gameOver = false;
            ballMoving = false;
            
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('gameOver').style.display = 'none';
            
            resetBall();
            generateBricks();
            draw();
            
            // Send restart to Telegram
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    action: 'game_restart',
                    score: score,
                    level: level
                }));
            }
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === ' ') startBall();
            if (e.key === 'r' && gameOver) restartGame();
        });
        
        // Touch controls for mobile
        let touchStartX = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            e.preventDefault();
        });
        
        canvas.addEventListener('touchmove', (e) => {
            const touchX = e.touches[0].clientX;
            const diff = touchX - touchStartX;
            
            if (Math.abs(diff) > 10) {
                if (diff > 0) moveRight();
                else moveLeft();
                touchStartX = touchX;
            }
            e.preventDefault();
        });
        
        // Initialize the game
        initGame();
    </script>
</body>
</html>
